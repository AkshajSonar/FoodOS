name: Backend CI Pipeline

on:
  push:
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # 3️⃣ Run unit tests
      - name: Run tests
        working-directory: backend
        run: |
          go test ./...

      # 4️⃣ Build Docker image
      - name: Build Docker image
        working-directory: backend
        run: |
          docker build -t foodos-backend:ci .
