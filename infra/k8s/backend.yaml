apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: foodos-backend
  template:
    metadata:
      labels:
        app: foodos-backend
    spec:
      containers:
        - name: backend
          image: foodos-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: foodos
            - name: POSTGRES_PASSWORD
              value: foodos
            - name: POSTGRES_DB
              value: foodos
            - name: REDIS_ADDR
              value: redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: foodos-backend
spec:
  selector:
    app: foodos-backend
  ports:
    - port: 8080
      targetPort: 8080
